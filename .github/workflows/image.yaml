name: Build image

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested image to GHCR (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ghcr.io/eeekcct/hermes-agent-image:sha-${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Test as the runtime user with a fresh data directory
        env:
          IMAGE: ghcr.io/eeekcct/hermes-agent-image:sha-${{ github.sha }}-${{ matrix.arch }}
        run: |
          docker run --rm --user 10000:10000 \
            -e HOME=/tmp/hermes-image-check -e HERMES_HOME=/tmp/hermes-image-check \
            --entrypoint /usr/local/libexec/hermes-image-smoke-test "$IMAGE"
      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested architecture image
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/eeekcct/hermes-agent-image:sha-${{ github.sha }}-${{ matrix.arch }}
        run: docker push "$IMAGE"

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image
        env:
          IMAGE: ghcr.io/eeekcct/hermes-agent-image
          REVISION: ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:sha-$REVISION" \
            --tag "$IMAGE:latest" \
            "$IMAGE:sha-$REVISION-amd64" \
            "$IMAGE:sha-$REVISION-arm64"
