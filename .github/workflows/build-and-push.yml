name: Build and push

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - scripts/build-dependencies.sh
      - scripts/verify-release.sh
      - .github/workflows/_build.yml
      - .github/workflows/_image.yml
      - .github/workflows/build-and-push.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_image.yml
