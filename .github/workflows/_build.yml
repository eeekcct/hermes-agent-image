name: Build and test one architecture

on:
  workflow_call:
    inputs:
      arch:
        type: string
        required: true
      runner:
        type: string
        required: true
      publish:
        type: boolean
        default: false
    outputs:
      digest:
        description: Published architecture image index digest
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ inputs.arch }}
          load: true
          push: false
          # The Docker exporter cannot preserve attestations. Publish the cached
          # result with the registry exporter after the runtime smoke test.
          provenance: false
          sbom: false
          tags: ghcr.io/eeekcct/hermes-agent-image:sha-${{ github.sha }}-${{ inputs.arch }}
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: ${{ !inputs.publish && format('type=gha,scope=pr-image-{0}', inputs.arch) || '' }}
          # Release builds use only the current VM's BuildKit cache.
          cache-to: ${{ !inputs.publish && format('type=gha,mode=max,scope=pr-image-{0}', inputs.arch) || '' }}
      - name: Test as the runtime user with a fresh data directory
        env:
          IMAGE: ghcr.io/eeekcct/hermes-agent-image:sha-${{ github.sha }}-${{ inputs.arch }}
        run: |
          docker run --rm -i --user 10000:10000 \
            -e HOME=/tmp/hermes-image-check -e HERMES_HOME=/tmp/hermes-image-check \
            --entrypoint /bin/sh "$IMAGE" -s < scripts/smoke-test.sh
      - name: Log in to GHCR
        if: inputs.publish && github.repository == 'eeekcct/hermes-agent-image' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested architecture with SBOM
        id: publish
        if: inputs.publish && github.repository == 'eeekcct/hermes-agent-image' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ inputs.arch }}
          push: true
          provenance: false
          sbom: true
          tags: ghcr.io/eeekcct/hermes-agent-image:sha-${{ github.sha }}-${{ inputs.arch }}
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: ${{ !inputs.publish && format('type=gha,scope=pr-image-{0}', inputs.arch) || '' }}
