name: Build, attest and publish image

on:
  workflow_call:
    outputs:
      digest:
        description: Verified and promoted multi-platform image digest
        value: ${{ jobs.promote.outputs.digest }}

jobs:
  build-amd64:
    if: github.repository == 'eeekcct/hermes-agent-image' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      arch: amd64
      runner: ubuntu-latest
      publish: true

  build-arm64:
    if: github.repository == 'eeekcct/hermes-agent-image' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      arch: arm64
      runner: ubuntu-26.04-arm
      publish: true

  publish:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      # No source checkout, Dockerfile, or test execution in the signing VM.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble multi-platform index from this run's digests
        id: image
        env:
          IMAGE: ghcr.io/eeekcct/hermes-agent-image
          REVISION: ${{ github.sha }}
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
        run: |
          [[ "$AMD64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ARM64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create \
            --tag "$IMAGE:sha-$REVISION" \
            --metadata-file "$RUNNER_TEMP/published-image.json" \
            "$IMAGE@$AMD64_DIGEST" \
            "$IMAGE@$ARM64_DIGEST"
          digest="$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/published-image.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest multi-platform image provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/eeekcct/hermes-agent-image
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          # Organization-only storage records do not apply to this repository.
          create-storage-record: false

  verify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      # Renovate updates the verifier version and binary checksum together.
      SLSA_VERIFIER_VERSION: v0.1.1
      SLSA_VERIFIER_SHA256: 7053bb00052a64c77dbba4400636fd22d336c1b10aba9aac1db44744b9efba31
      IMAGE: ghcr.io/eeekcct/hermes-agent-image
      REPOSITORY: eeekcct/hermes-agent-image
      WORKFLOW: eeekcct/hermes-agent-image/.github/workflows/_image.yml
      BUILDER: https://github.com/eeekcct/hermes-agent-image/.github/workflows/_image.yml@refs/heads/main
      DIGEST: ${{ needs.publish.outputs.digest }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      # No checkout, signing/OIDC permission, or package-write permission.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify image identity and provenance with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --repo "$REPOSITORY" \
            --signer-workflow "$WORKFLOW" \
            --signer-digest "$SOURCE_SHA" \
            --source-digest "$SOURCE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/verified.json"
          # Use only a bundle accepted by the certificate-backed checks above.
          jq -e '.[0].attestation.bundle | select(type == "object")' \
            "$RUNNER_TEMP/verified.json" > "$RUNNER_TEMP/bundle.json"
      - name: Install pinned official SLSA verifier
        id: slsa-verifier
        uses: slsa-framework/actions/install/verifier@3efdf6f2112b1170cb369442620788752df11bca # v0.2.0
        with:
          version: ${{ env.SLSA_VERIFIER_VERSION }}
          verify: true
      - name: Check pinned SLSA verifier checksum
        env:
          SLSA_VERIFIER: ${{ steps.slsa-verifier.outputs.path }}
        shell: bash
        run: |
          # Retain the exact binary pin in addition to the action's provenance check.
          printf '%s  %s\n' "$SLSA_VERIFIER_SHA256" "$SLSA_VERIFIER" | sha256sum --check --strict
      - name: Require SLSA Build Level 3 policy
        env:
          SLSA_VERIFIER: ${{ steps.slsa-verifier.outputs.path }}
        shell: bash
        run: |
          # The allowlist explicitly trusts the reviewed reusable workflow.
          # shell: bash enables pipefail: a printed level never overrides failure.
          "$SLSA_VERIFIER" build \
            --require-signatures \
            --signer "sigstore::https://token.actions.githubusercontent.com::$BUILDER" \
            --param "expected_source:github.com/$REPOSITORY" \
            --param "trusted_builders:[$BUILDER]" \
            --param 'expected_branch:refs/heads/main' \
            --subject "$DIGEST" \
            --level 3 \
            --verbose \
            "$RUNNER_TEMP/bundle.json" | tee "$RUNNER_TEMP/slsa-result.txt"
      - name: Summarize successful provenance verification
        shell: bash
        run: |
          {
            printf '### Release provenance verification passed\n\n'
            printf 'Image: `%s@%s`\n\n' "$IMAGE" "$DIGEST"
            printf 'Source and signer commit: `%s`\n\n' "$SOURCE_SHA"
            printf '```text\n'
            cat "$RUNNER_TEMP/slsa-result.txt"
            printf '```\n\n'
            printf 'The SLSA level is a policy result trusting the reviewed reusable workflow, not an independent certification.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: [publish, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified image to latest
        env:
          IMAGE: ghcr.io/eeekcct/hermes-agent-image
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
