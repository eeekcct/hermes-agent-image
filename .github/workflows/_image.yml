name: Build, attest and publish image

on:
  workflow_call:
    outputs:
      digest:
        description: Signed multi-platform image digest
        value: ${{ jobs.publish.outputs.digest }}

jobs:
  build-amd64:
    if: github.repository == 'eeekcct/hermes-agent-image' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      arch: amd64
      runner: ubuntu-latest
      publish: true

  build-arm64:
    if: github.repository == 'eeekcct/hermes-agent-image' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      arch: arm64
      runner: ubuntu-26.04-arm
      publish: true

  publish:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      # No source checkout, Dockerfile, or test execution in the signing VM.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble multi-platform index from this run's digests
        id: image
        env:
          IMAGE: ghcr.io/eeekcct/hermes-agent-image
          REVISION: ${{ github.sha }}
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
        run: |
          [[ "$AMD64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ARM64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create \
            --tag "$IMAGE:sha-$REVISION" \
            --metadata-file "$RUNNER_TEMP/published-image.json" \
            "$IMAGE@$AMD64_DIGEST" \
            "$IMAGE@$ARM64_DIGEST"
          digest="$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/published-image.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest multi-platform image provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/eeekcct/hermes-agent-image
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          # Organization-only storage records do not apply to this repository.
          create-storage-record: false
      - name: Verify digest, reusable signer and source before promotion
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/eeekcct/hermes-agent-image
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --repo eeekcct/hermes-agent-image \
            --signer-workflow eeekcct/hermes-agent-image/.github/workflows/_image.yml \
            --signer-digest "$SOURCE_SHA" \
            --source-digest "$SOURCE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
      - name: Promote verified image to latest
        env:
          IMAGE: ghcr.io/eeekcct/hermes-agent-image
          DIGEST: ${{ steps.image.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
