name: Build and test image

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          # The Docker exporter cannot preserve attestations. Publish the cached
          # result with the registry exporter after the runtime smoke test.
          provenance: false
          sbom: false
          tags: ghcr.io/eeekcct/hermes-agent-image:sha-${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Test as the runtime user with a fresh data directory
        env:
          IMAGE: ghcr.io/eeekcct/hermes-agent-image:sha-${{ github.sha }}-${{ matrix.arch }}
        run: |
          docker run --rm -i --user 10000:10000 \
            -e HOME=/tmp/hermes-image-check -e HERMES_HOME=/tmp/hermes-image-check \
            --entrypoint /bin/sh "$IMAGE" -s < scripts/smoke-test.sh
      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested architecture with SBOM and provenance
        id: publish
        if: inputs.publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/eeekcct/hermes-agent-image:sha-${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
      - name: Verify published content and attestations
        if: inputs.publish
        env:
          IMAGE: ghcr.io/eeekcct/hermes-agent-image:sha-${{ github.sha }}-${{ matrix.arch }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          tested_config="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          python3 scripts/verify-attestations.py "$IMAGE@$DIGEST" \
            --platform "$ARCH" --expected-config "$tested_config"

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image
        env:
          IMAGE: ghcr.io/eeekcct/hermes-agent-image
          REVISION: ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:sha-$REVISION" \
            --metadata-file "$RUNNER_TEMP/published-image.json" \
            "$IMAGE:sha-$REVISION-amd64" \
            "$IMAGE:sha-$REVISION-arm64"
          digest="$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/published-image.json")"
          python3 scripts/verify-attestations.py "$IMAGE@$digest" \
            --platform amd64 --platform arm64
          # Promote the verified index, including its attestation descriptors.
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$digest"
